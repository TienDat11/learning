<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" role="img" aria-label="Đường đi của một câu SQL qua parser, planner, executor, buffer manager tới đĩa">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- stats source -->
    <rect x="452" y="64" width="288" height="112" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="596" y="100" text-anchor="middle" font-size="21" font-weight="700" fill="#14161A">pg_statistic</text>
    <text x="596" y="126" text-anchor="middle" font-size="15" fill="#6B7280">histogram · null_frac</text>
    <text x="596" y="150" text-anchor="middle" font-size="15" fill="#6B7280">do ANALYZE ghi vào</text>
    <line x1="596" y1="176" x2="596" y2="252" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="612" y="222" font-size="14" fill="#6B7280">đầu vào của chi phí</text>

    <!-- main chain -->
    <rect x="40" y="272" width="180" height="96" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="130" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#14161A">SQL</text>
    <text x="130" y="334" text-anchor="middle" font-size="15" fill="#6B7280">từ ORM hoặc tay</text>

    <rect x="252" y="272" width="180" height="96" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="342" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#14161A">Parser</text>
    <text x="342" y="334" text-anchor="middle" font-size="15" fill="#6B7280">rewrite, chuẩn hoá</text>

    <rect x="464" y="272" width="180" height="96" rx="8" fill="#EEF0FE" stroke="#4F46E5" stroke-width="1.6"/>
    <text x="554" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#4F46E5">Planner</text>
    <text x="554" y="334" text-anchor="middle" font-size="15" fill="#4F46E5">chọn kế hoạch rẻ nhất</text>

    <rect x="676" y="272" width="180" height="96" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="766" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#14161A">Executor</text>
    <text x="766" y="334" text-anchor="middle" font-size="15" fill="#6B7280">scan · join · sort</text>

    <rect x="888" y="272" width="180" height="96" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="978" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#14161A">Buffers</text>
    <text x="978" y="334" text-anchor="middle" font-size="15" fill="#6B7280">shared_buffers</text>

    <rect x="1100" y="272" width="180" height="96" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="1190" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#14161A">Đĩa</text>
    <text x="1190" y="334" text-anchor="middle" font-size="15" fill="#6B7280">readahead</text>

    <line x1="220" y1="320" x2="248" y2="320" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="432" y1="320" x2="460" y2="320" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="644" y1="320" x2="672" y2="320" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="856" y1="320" x2="884" y2="320" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="1068" y1="320" x2="1096" y2="320" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- cost constants -->
    <rect x="440" y="424" width="312" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="596" y="456" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">seq_page_cost · random_page_cost</text>
    <text x="596" y="482" text-anchor="middle" font-size="15" fill="#6B7280">cpu_tuple_cost · work_mem</text>
    <line x1="596" y1="424" x2="596" y2="372" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#a)"/>

    <line x1="40" y1="552" x2="1400" y2="552" stroke="#E5E7EB"/>
    <text x="40" y="590" font-size="16" fill="#6B7280">Sai ở khối Planner thì mọi khối phía sau chạy đúng nhưng chậm; sửa ở Executor không bao giờ chữa được lỗi ước lượng.</text>
  </g>
</svg>
