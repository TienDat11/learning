<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" role="img" aria-label="Cùng một request đi qua ba framework theo ba đường khác nhau">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- Django lane -->
    <text x="40" y="96" font-size="19" font-weight="700" fill="#14161A">Django</text>
    <text x="40" y="120" font-size="14" fill="#6B7280">WSGI</text>
    <rect x="170" y="52" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="268" y="86" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">WSGIHandler</text>
    <text x="268" y="112" text-anchor="middle" font-size="14" fill="#6B7280">dựng HttpRequest</text>
    <rect x="390" y="52" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="488" y="86" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">middleware</text>
    <text x="488" y="112" text-anchor="middle" font-size="14" fill="#6B7280">bọc ngoài view</text>
    <rect x="610" y="52" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="708" y="86" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">URLResolver</text>
    <text x="708" y="112" text-anchor="middle" font-size="14" fill="#6B7280">khớp pattern</text>
    <rect x="830" y="52" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="928" y="86" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">view</text>
    <text x="928" y="112" text-anchor="middle" font-size="14" fill="#6B7280">gọi ORM</text>
    <rect x="1050" y="52" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="1148" y="86" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">ORM</text>
    <text x="1148" y="112" text-anchor="middle" font-size="14" fill="#6B7280">kết nối theo thread</text>
    <line x1="366" y1="96" x2="386" y2="96" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="586" y1="96" x2="606" y2="96" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="806" y1="96" x2="826" y2="96" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="1026" y1="96" x2="1046" y2="96" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>

    <!-- Flask lane -->
    <text x="40" y="266" font-size="19" font-weight="700" fill="#14161A">Flask</text>
    <text x="40" y="290" font-size="14" fill="#6B7280">WSGI</text>
    <rect x="170" y="222" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="268" y="256" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">Werkzeug</text>
    <text x="268" y="282" text-anchor="middle" font-size="14" fill="#6B7280">parse request</text>
    <rect x="390" y="222" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="488" y="256" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">contexts</text>
    <text x="488" y="282" text-anchor="middle" font-size="14" fill="#6B7280">request · g · app</text>
    <rect x="610" y="222" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="708" y="256" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">blueprint</text>
    <text x="708" y="282" text-anchor="middle" font-size="14" fill="#6B7280">before_request</text>
    <rect x="830" y="222" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="928" y="256" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">view</text>
    <text x="928" y="282" text-anchor="middle" font-size="14" fill="#6B7280">hàm thường</text>
    <rect x="1050" y="222" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="1148" y="256" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">scoped session</text>
    <text x="1148" y="282" text-anchor="middle" font-size="14" fill="#6B7280">teardown đóng</text>
    <line x1="366" y1="266" x2="386" y2="266" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="586" y1="266" x2="606" y2="266" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="806" y1="266" x2="826" y2="266" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="1026" y1="266" x2="1046" y2="266" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>

    <!-- FastAPI lane -->
    <text x="40" y="436" font-size="19" font-weight="700" fill="#4F46E5">FastAPI</text>
    <text x="40" y="460" font-size="14" fill="#4F46E5">ASGI</text>
    <rect x="170" y="392" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="268" y="426" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">Starlette route</text>
    <text x="268" y="452" text-anchor="middle" font-size="14" fill="#6B7280">scope · receive · send</text>
    <rect x="390" y="392" width="196" height="88" rx="8" fill="#EEF0FE" stroke="#4F46E5" stroke-width="1.6"/>
    <text x="488" y="426" text-anchor="middle" font-size="17" font-weight="600" fill="#4F46E5">Depends</text>
    <text x="488" y="452" text-anchor="middle" font-size="14" fill="#4F46E5">giải cây phụ thuộc</text>
    <rect x="610" y="392" width="196" height="88" rx="8" fill="#EEF0FE" stroke="#4F46E5" stroke-width="1.6"/>
    <text x="708" y="426" text-anchor="middle" font-size="17" font-weight="600" fill="#4F46E5">Pydantic</text>
    <text x="708" y="452" text-anchor="middle" font-size="14" fill="#4F46E5">sai kiểu → 422</text>
    <rect x="830" y="392" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="928" y="426" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">endpoint</text>
    <text x="928" y="452" text-anchor="middle" font-size="14" fill="#6B7280">async → loop</text>
    <rect x="1050" y="392" width="196" height="88" rx="8" fill="#FFFFFF" stroke="#D8DAE0"/>
    <text x="1148" y="426" text-anchor="middle" font-size="17" font-weight="600" fill="#14161A">response_model</text>
    <text x="1148" y="452" text-anchor="middle" font-size="14" fill="#6B7280">lọc field khi ra</text>
    <line x1="366" y1="436" x2="386" y2="436" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="586" y1="436" x2="606" y2="436" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="806" y1="436" x2="826" y2="436" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>
    <line x1="1026" y1="436" x2="1046" y2="436" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#d)"/>

    <line x1="40" y1="536" x2="1400" y2="536" stroke="#E5E7EB"/>
    <text x="40" y="574" font-size="16" fill="#6B7280">Ba đường, cùng một mục tiêu: dữ liệu thô vào, dữ liệu đúng kiểu ra. Khác biệt là ai làm bước kiểm tra và ở đâu tài nguyên được đóng.</text>
  </g>
</svg>
