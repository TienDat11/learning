<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="flow-upload-presign-m-t flow-upload-presign-m-d"><title id="flow-upload-presign-m-t">Upload bằng presigned URL (điện thoại)</title><desc id="flow-upload-presign-m-d">Client xin presigned URL từ API, PUT bytes thẳng lên S3, API ghi bản ghi và trả object key.</desc><defs><marker id="flow-upload-presign-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-upload-presign-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="360" fill="#0B0F14"/><g id="flow-upload-presign-m-n1"><rect x="24" y="20" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="45" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Vue client</text><text x="180" y="61" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">chọn tệp</text></g><g id="flow-upload-presign-m-n2"><rect x="24" y="92" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="117" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">API ký URL</text><text x="180" y="133" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">TTL 15 phút</text></g><g id="flow-upload-presign-m-n3"><rect x="24" y="164" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="189" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">S3</text><text x="180" y="205" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">PUT trực tiếp</text></g><g id="flow-upload-presign-m-n4"><rect x="24" y="236" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="261" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Ghi record</text><text x="180" y="277" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">RDS</text></g><path id="flow-upload-presign-m-n5" d="M180 72 V92" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-upload-presign-m-arr)"/><path id="flow-upload-presign-m-n6" d="M180 144 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-upload-presign-m-arr)"/><path id="flow-upload-presign-m-n7" d="M180 216 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-upload-presign-m-arr)"/><path id="flow-upload-presign-m-n8" d="M24 262 H12 V46 H24" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-upload-presign-m-arr-m)"/><text x="180" y="318" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">trả object key</text><text x="180" y="344" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Client PUT trực tiếp, không qua Lambda</text></svg>
