<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="flow-request-lifecycle-d-t flow-request-lifecycle-d-d"><title id="flow-request-lifecycle-d-t">Vòng đời HTTP request</title><desc id="flow-request-lifecycle-d-d">Năm bước từ trình duyệt qua CloudFront, API Gateway, ECS Fargate tới RDS, rồi response quay ngược về client trên cùng connection.</desc><defs><marker id="flow-request-lifecycle-d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-request-lifecycle-d-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="640" height="220" fill="#0B0F14"/><g id="flow-request-lifecycle-d-n1"><rect x="10" y="60" width="104" height="60" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="62" y="89" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Browser</text><text x="62" y="105" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">gọi API</text></g><path id="flow-request-lifecycle-d-n2" d="M114 90 H136" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-request-lifecycle-d-arr)"/><g id="flow-request-lifecycle-d-n3"><rect x="136" y="60" width="104" height="60" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="188" y="89" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">CloudFront</text><text x="188" y="105" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">TLS + cache</text></g><path id="flow-request-lifecycle-d-n4" d="M240 90 H262" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-request-lifecycle-d-arr)"/><g id="flow-request-lifecycle-d-n5"><rect x="262" y="60" width="104" height="60" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="314" y="89" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">API Gateway</text><text x="314" y="105" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">JWT authorizer</text></g><path id="flow-request-lifecycle-d-n6" d="M366 90 H388" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-request-lifecycle-d-arr)"/><g id="flow-request-lifecycle-d-n7"><rect x="388" y="60" width="104" height="60" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="440" y="89" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">ECS Fargate</text><text x="440" y="105" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">FastAPI</text></g><path id="flow-request-lifecycle-d-n8" d="M492 90 H514" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-request-lifecycle-d-arr)"/><g id="flow-request-lifecycle-d-n9"><rect x="514" y="60" width="104" height="60" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="566" y="89" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">RDS</text><text x="566" y="105" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">Postgres</text></g><path id="flow-request-lifecycle-d-n10" d="M566 120 V156 H62 V120" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-request-lifecycle-d-arr-m)"/><text x="320" y="178" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">response 200</text><text x="320" y="204" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Keep-alive: handshake chỉ lần đầu</text></svg>
