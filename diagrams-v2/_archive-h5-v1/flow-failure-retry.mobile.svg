<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" role="img" aria-labelledby="flow-failure-retry-m-t flow-failure-retry-m-d"><title id="flow-failure-retry-m-t">Retry và backoff (điện thoại)</title><desc id="flow-failure-retry-m-d">Gọi dịch vụ, gặp lỗi tạm thời thì chờ backoff rồi thử lại; hết số lần cho phép thì đưa vào DLQ và cảnh báo.</desc><defs><marker id="flow-failure-retry-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-failure-retry-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="432" fill="#0B0F14"/><g id="flow-failure-retry-m-n1"><rect x="24" y="20" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="51" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Gọi dịch vụ</text></g><path id="flow-failure-retry-m-n2" d="M180 72 V92" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-failure-retry-m-arr)"/><g id="flow-failure-retry-m-n3"><rect x="24" y="92" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="117" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Lỗi 5xx</text><text x="180" y="133" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">timeout</text></g><path id="flow-failure-retry-m-n4" d="M180 144 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-failure-retry-m-arr)"/><g id="flow-failure-retry-m-n5"><rect x="24" y="164" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="189" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Chờ backoff</text><text x="180" y="205" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">1s, 2s, 4s</text></g><path id="flow-failure-retry-m-n6" d="M180 216 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-failure-retry-m-arr)"/><g id="flow-failure-retry-m-n7"><rect x="24" y="236" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="261" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Còn số lần?</text><text x="180" y="277" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">attempts &lt; 5</text></g><path id="flow-failure-retry-m-n8" d="M24 262 H12 V46 H24" fill="none" stroke="#FFB000" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-failure-retry-m-arr)"/><g id="flow-failure-retry-m-n9"><rect x="24" y="308" width="312" height="52" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="180" y="333" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">DLQ + cảnh báo</text><text x="180" y="349" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">cần người xử lý</text></g><path id="flow-failure-retry-m-n10" d="M180 288 V308" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-failure-retry-m-arr-m)"/><text x="196" y="302" text-anchor="start" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">hết lượt</text><text x="180" y="392" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Chỉ retry lỗi tạm thời</text><text x="180" y="416" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">lỗi 4xx thì retry vô nghĩa</text></svg>
