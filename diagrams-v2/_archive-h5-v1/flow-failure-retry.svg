<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="flow-failure-retry-d-t flow-failure-retry-d-d"><title id="flow-failure-retry-d-t">Retry và backoff</title><desc id="flow-failure-retry-d-d">Gọi dịch vụ, gặp lỗi tạm thời thì chờ backoff rồi thử lại; hết số lần cho phép thì đưa vào DLQ và cảnh báo.</desc><defs><marker id="flow-failure-retry-d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-failure-retry-d-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="640" height="240" fill="#0B0F14"/><g id="flow-failure-retry-d-n1"><rect x="12" y="76" width="128" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="76" y="107" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Gọi dịch vụ</text></g><g id="flow-failure-retry-d-n2"><rect x="172" y="76" width="128" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="236" y="101" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Lỗi 5xx</text><text x="236" y="117" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">timeout</text></g><g id="flow-failure-retry-d-n3"><rect x="332" y="76" width="128" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="396" y="101" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Chờ backoff</text><text x="396" y="117" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">1s, 2s, 4s</text></g><g id="flow-failure-retry-d-n4"><rect x="492" y="76" width="128" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="556" y="101" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Còn số lần?</text><text x="556" y="117" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">attempts &lt; 5</text></g><path id="flow-failure-retry-d-n5" d="M140 102 H172" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-failure-retry-d-arr)"/><path id="flow-failure-retry-d-n6" d="M300 102 H332" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-failure-retry-d-arr)"/><path id="flow-failure-retry-d-n7" d="M460 102 H492" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-failure-retry-d-arr)"/><path id="flow-failure-retry-d-n8" d="M556 76 V36 H76 V76" fill="none" stroke="#FFB000" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-failure-retry-d-arr)"/><text x="316" y="28" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFB000">thử lại</text><g id="flow-failure-retry-d-n9"><rect x="481" y="156" width="150" height="52" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="556" y="181" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">DLQ + cảnh báo</text><text x="556" y="197" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">cần người xử lý</text></g><path id="flow-failure-retry-d-n10" d="M556 128 V156" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-failure-retry-d-arr-m)"/><text x="566" y="146" text-anchor="start" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">hết lượt</text><text x="320" y="232" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Chỉ retry lỗi tạm thời, lỗi 4xx thì không</text></svg>
