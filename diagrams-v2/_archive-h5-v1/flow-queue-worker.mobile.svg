<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 476" role="img" aria-labelledby="flow-queue-worker-m-t flow-queue-worker-m-d"><title id="flow-queue-worker-m-t">Hàng đợi SQS và worker (điện thoại)</title><desc id="flow-queue-worker-m-d">Producer gửi message vào SQS, worker nhận và xử lý; thành công thì DeleteMessage, lỗi nhiều lần thì vào DLQ.</desc><defs><marker id="flow-queue-worker-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-queue-worker-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="476" fill="#0B0F14"/><g id="flow-queue-worker-m-n1"><rect x="24" y="20" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="45" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Producer</text><text x="180" y="61" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">FastAPI + outbox</text></g><path id="flow-queue-worker-m-n2" d="M180 72 V92" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-queue-worker-m-arr)"/><g id="flow-queue-worker-m-n3"><rect x="24" y="92" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="117" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">SQS</text><text x="180" y="133" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">standard queue</text></g><path id="flow-queue-worker-m-n4" d="M180 144 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-queue-worker-m-arr)"/><g id="flow-queue-worker-m-n5"><rect x="24" y="164" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="189" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Worker poll</text><text x="180" y="205" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">ReceiveMessage</text></g><path id="flow-queue-worker-m-n6" d="M180 216 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-queue-worker-m-arr)"/><g id="flow-queue-worker-m-n7"><rect x="24" y="236" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="261" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Xử lý</text><text x="180" y="277" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">ghi DB</text></g><path id="flow-queue-worker-m-n8" d="M180 288 V308" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-queue-worker-m-arr)"/><g id="flow-queue-worker-m-n9"><rect x="24" y="308" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="333" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">DeleteMessage</text><text x="180" y="349" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">ack</text></g><g id="flow-queue-worker-m-n10"><rect x="24" y="380" width="312" height="52" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="180" y="405" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">DLQ</text><text x="180" y="421" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">maxReceive 3</text></g><path id="flow-queue-worker-m-n11" d="M336 190 H352 V406 H336" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-queue-worker-m-arr-m)"/><path id="flow-queue-worker-m-n12" d="M24 190 H10 V118 H24" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-queue-worker-m-arr-m)"/><text x="180" y="462" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Poll dài giảm số lần trả rỗng</text></svg>
