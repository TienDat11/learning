<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="flow-auth-jwt-d-t flow-auth-jwt-d-d"><title id="flow-auth-jwt-d-t">Xác thực JWT</title><desc id="flow-auth-jwt-d-d">Token từ header Authorization được kiểm tra chữ ký, hạn dùng và scope; hợp lệ thì 200, sai hoặc hết hạn thì 401.</desc><defs><marker id="flow-auth-jwt-d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-auth-jwt-d-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="640" height="240" fill="#0B0F14"/><g id="flow-auth-jwt-d-n1"><rect x="12" y="56" width="116" height="54" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="70" y="82" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Login</text><text x="70" y="98" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">POST /auth</text></g><g id="flow-auth-jwt-d-n2"><rect x="162" y="56" width="116" height="54" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="220" y="82" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Ký token</text><text x="220" y="98" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">RS256, exp</text></g><g id="flow-auth-jwt-d-n3"><rect x="312" y="56" width="116" height="54" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="370" y="82" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Bearer token</text><text x="370" y="98" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">Authorization</text></g><g id="flow-auth-jwt-d-n4"><rect x="462" y="56" width="116" height="54" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="520" y="82" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Verify</text><text x="520" y="98" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">ký, hạn, scope</text></g><path id="flow-auth-jwt-d-n5" d="M128 83 H162" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-auth-jwt-d-arr)"/><path id="flow-auth-jwt-d-n6" d="M278 83 H312" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-auth-jwt-d-arr)"/><path id="flow-auth-jwt-d-n7" d="M428 83 H462" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-auth-jwt-d-arr)"/><g id="flow-auth-jwt-d-n8"><rect x="445" y="170" width="150" height="44" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="520" y="191" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">200 + dữ liệu</text><text x="520" y="207" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">hợp lệ</text></g><g id="flow-auth-jwt-d-n9"><rect x="161" y="170" width="150" height="44" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="236" y="191" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">401</text><text x="236" y="207" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">sai / hết hạn</text></g><path id="flow-auth-jwt-d-n10" d="M520 110 V170" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-auth-jwt-d-arr)"/><path id="flow-auth-jwt-d-n11" d="M480 110 V138 H236 V170" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-auth-jwt-d-arr-m)"/><text x="320" y="234" text-anchor="middle" font-family="Chivo, Arial, 