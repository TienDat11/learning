<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 608" width="360" height="608" role="img" aria-labelledby="flow-cicd-pipeline-m-t flow-cicd-pipeline-m-d"><title id="flow-cicd-pipeline-m-t">Pipeline CI/CD (điện thoại)</title><desc id="flow-cicd-pipeline-m-d">Commit kích hoạt workflow, chạy test và lint, build image, đẩy lên ECR, rồi triển khai lên ECS; lỗi ở test thì dừng.</desc><defs><marker id="flow-cicd-pipeline-m-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4F46E5"/></marker><marker id="flow-cicd-pipeline-m-arrow-alt" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5F5F6A"/></marker></defs><rect class="bg" x="0" y="0" width="360" height="608" fill="#FAFAFA"/><rect class="box" data-key="commit" x="64" y="48" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Commit</text><text class="lbl" x="196" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">kích hoạt CI</text><circle cx="36" cy="76" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="36" y="81" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">1</text><rect class="box" data-key="test" x="64" y="144" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Test + lint</text><text class="lbl" x="196" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">chạy test</text><circle cx="36" cy="172" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="36" y="177" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">2</text><rect class="box" data-key="build" x="64" y="240" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="265" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Build image</text><text class="lbl" x="196" y="281" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">Docker</text><circle cx="36" cy="268" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="36" y="273" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">3</text><rect class="box" data-key="ecr" x="64" y="336" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="361" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Push ECR</text><text class="lbl" x="196" y="377" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">đẩy image</text><circle cx="36" cy="364" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="36" y="369" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">4</text><rect class="box" data-key="deploy" x="64" y="432" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="lbl" x="196" y="457" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Deploy ECS</text><text class="lbl" x="196" y="473" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">task mới</text><circle cx="36" cy="460" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="36" y="465" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">5</text><rect class="box" data-key="stop" x="64" y="528" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="196" y="553" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Dừng pipeline</text><text class="lbl" x="196" y="569" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5F6A">test lỗi</text><path class="edge" d="M196 104 L 196 144" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-cicd-pipeline-m-arrow)"/><path class="edge" d="M196 200 L 196 240" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-cicd-pipeline-m-arrow)"/><path class="edge" d="M196 296 L 196 336" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-cicd-pipeline-m-arrow)"/><path class="edge" d="M196 392 L 196 432" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-cicd-pipeline-m-arrow)"/><path class="edge" d="M328 172 L 344 172 L 344 556 L 328 556" fill="none" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flow-cicd-pipeline-m-arrow-alt)"/></svg>
