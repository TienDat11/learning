<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 452" role="img" aria-labelledby="flow-request-lifecycle-m-t flow-request-lifecycle-m-d"><title id="flow-request-lifecycle-m-t">Vòng đời HTTP request (điện thoại)</title><desc id="flow-request-lifecycle-m-d">Năm bước từ trình duyệt qua CloudFront, API Gateway, ECS Fargate tới RDS, rồi response quay ngược về client trên cùng connection.</desc><defs><marker id="flow-request-lifecycle-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-request-lifecycle-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="452" fill="#0B0F14"/><g id="flow-request-lifecycle-m-n1"><rect x="24" y="20" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="45" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Browser</text><text x="180" y="61" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">gọi API</text></g><path id="flow-request-lifecycle-m-n2" d="M180 72 V98" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-request-lifecycle-m-arr)"/><g id="flow-request-lifecycle-m-n3"><rect x="24" y="98" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="123" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">CloudFront</text><text x="180" y="139" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">TLS + cache</text></g><path id="flow-request-lifecycle-m-n4" d="M180 150 V176" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-request-lifecycle-m-arr)"/><g id="flow-request-lifecycle-m-n5"><rect x="24" y="176" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="201" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">API Gateway</text><text x="180" y="217" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">JWT authorizer</text></g><path id="flow-request-lifecycle-m-n6" d="M180 228 V254" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-request-lifecycle-m-arr)"/><g id="flow-request-lifecycle-m-n7"><rect x="24" y="254" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="279" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">ECS Fargate</text><text x="180" y="295" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">FastAPI</text></g><path id="flow-request-lifecycle-m-n8" d="M180 306 V332" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-request-lifecycle-m-arr)"/><g id="flow-request-lifecycle-m-n9"><rect x="24" y="332" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="357" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">RDS</text><text x="180" y="373" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">Postgres</text></g><path id="flow-request-lifecycle-m-n10" d="M24 358 H12 V46 H24" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-request-lifecycle-m-arr-m)"/><text x="180" y="416" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">response 200</text><text x="180" y="440" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">