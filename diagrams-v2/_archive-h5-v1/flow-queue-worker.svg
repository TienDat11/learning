<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="flow-queue-worker-d-t flow-queue-worker-d-d"><title id="flow-queue-worker-d-t">Hàng đợi SQS và worker</title><desc id="flow-queue-worker-d-d">Producer gửi message vào SQS, worker nhận và xử lý; thành công thì DeleteMessage, lỗi nhiều lần thì vào DLQ.</desc><defs><marker id="flow-queue-worker-d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-queue-worker-d-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="640" height="240" fill="#0B0F14"/><g id="flow-queue-worker-d-n1"><rect x="12" y="50" width="124" height="56" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="74" y="77" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Producer</text><text x="74" y="93" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">FastAPI + outbox</text></g><g id="flow-queue-worker-d-n2"><rect x="172" y="50" width="124" height="56" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="234" y="77" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">SQS</text><text x="234" y="93" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">standard queue</text></g><g id="flow-queue-worker-d-n3"><rect x="332" y="50" width="124" height="56" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="394" y="77" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Worker poll</text><text x="394" y="93" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">ReceiveMessage</text></g><g id="flow-queue-worker-d-n4"><rect x="492" y="50" width="124" height="56" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="554" y="77" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Xử lý</text><text x="554" y="93" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">ghi DB</text></g><g id="flow-queue-worker-d-n5"><rect x="492" y="150" width="124" height="56" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="554" y="177" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">DeleteMessage</text><text x="554" y="193" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">ack</text></g><g id="flow-queue-worker-d-n6"><rect x="172" y="150" width="124" height="56" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="234" y="177" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">DLQ</text><text x="234" y="193" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">maxReceive 3</text></g><path id="flow-queue-worker-d-n7" d="M136 78 H172" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-queue-worker-d-arr)"/><path id="flow-queue-worker-d-n8" d="M296 78 H332" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-queue-worker-d-arr)"/><path id="flow-queue-worker-d-n9" d="M456 78 H492" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-queue-worker-d-arr)"/><path id="flow-queue-worker-d-n10" d="M554 106 V150" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-queue-worker-d-arr)"/><path id="flow-queue-worker-d-n11" d="M234 106 V150" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-queue-worker-d-arr-m)"/><path id="flow-queue-worker-d-n12" d="M394 50 V32 H234 V50" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-queue-worker-d-arr-m)"/><text x="314" y="24" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">hết visibility</text><text x="320" y="232" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Poll dài giảm số lần trả rỗng</text></svg>
