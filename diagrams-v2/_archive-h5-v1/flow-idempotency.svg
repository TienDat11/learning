<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="flow-idempotency-d-t flow-idempotency-d-d"><title id="flow-idempotency-d-t">Idempotency key</title><desc id="flow-idempotency-d-d">Client gửi Idempotency-Key; server tra bảng khóa: đã có thì trả response cũ, chưa có thì thực thi rồi lưu kết quả.</desc><defs><marker id="flow-idempotency-d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-idempotency-d-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="640" height="240" fill="#0B0F14"/><g id="flow-idempotency-d-n1"><rect x="12" y="92" width="112" height="56" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="68" y="119" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Client</text><text x="68" y="135" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">UUID v4</text></g><g id="flow-idempotency-d-n2"><rect x="160" y="92" width="112" height="56" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="216" y="119" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Tra khóa</text><text x="216" y="135" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">UNIQUE key</text></g><g id="flow-idempotency-d-n3"><rect x="328" y="40" width="150" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="403" y="65" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Đã có key</text><text x="403" y="81" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">trả response cũ</text></g><g id="flow-idempotency-d-n4"><rect x="328" y="144" width="150" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="403" y="169" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Chưa có key</text><text x="403" y="185" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">thực thi + lưu</text></g><g id="flow-idempotency-d-n5"><rect x="512" y="92" width="116" height="56" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="570" y="119" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Trả response</text><text x="570" y="135" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">201 Created</text></g><path id="flow-idempotency-d-n6" d="M124 120 H160" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-d-arr)"/><path id="flow-idempotency-d-n7" d="M272 120 H300 V66 H328" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-d-arr)"/><path id="flow-idempotency-d-n8" d="M272 120 H300 V170 H328" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-d-arr)"/><path id="flow-idempotency-d-n9" d="M478 66 H496 V106 H512" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-d-arr)"/><path id="flow-idempotency-d-n10" d="M478 170 H496 V134 H512" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-d-arr)"/><text x="320" y="232" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Retry không kèm key vẫn tạo bản ghi trùng</text></svg>
