<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="flow-db-transaction-d-t flow-db-transaction-d-d"><title id="flow-db-transaction-d-t">Transaction PostgreSQL</title><desc id="flow-db-transaction-d-d">BEGIN rồi các câu ghi; nếu tất cả thành công thì COMMIT, có lỗi thì ROLLBACK.</desc><defs><marker id="flow-db-transaction-d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-db-transaction-d-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="640" height="240" fill="#0B0F14"/><g id="flow-db-transaction-d-n1"><rect x="12" y="56" width="124" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="74" y="87" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">BEGIN</text></g><g id="flow-db-transaction-d-n2"><rect x="172" y="56" width="124" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="234" y="87" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">UPDATE orders</text></g><g id="flow-db-transaction-d-n3"><rect x="332" y="56" width="124" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="394" y="87" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">UPDATE stock</text></g><g id="flow-db-transaction-d-n4"><rect x="492" y="56" width="124" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="554" y="87" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">INSERT audit</text></g><path id="flow-db-transaction-d-n5" d="M136 82 H172" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-db-transaction-d-arr)"/><path id="flow-db-transaction-d-n6" d="M296 82 H332" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-db-transaction-d-arr)"/><path id="flow-db-transaction-d-n7" d="M456 82 H492" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-db-transaction-d-arr)"/><g id="flow-db-transaction-d-n8"><rect x="300" y="168" width="130" height="48" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="365" y="191" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">COMMIT</text><text x="365" y="207" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">thành công</text></g><g id="flow-db-transaction-d-n9"><rect x="60" y="168" width="150" height="48" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="135" y="191" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">ROLLBACK</text><text x="135" y="207" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">có lỗi</text></g><path id="flow-db-transaction-d-n10" d="M554 108 V136 H365 V168" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-db-transaction-d-arr)"/><path id="flow-db-transaction-d-n11" d="M394 108 V124 H135 V168" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-db-transaction-d-arr-m)"/><text x="320" y="234" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Deadlock: PostgreSQL huỷ một bên</text></svg>
