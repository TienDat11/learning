<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="flow-lambda-cold-start-m-t flow-lambda-cold-start-m-d"><title id="flow-lambda-cold-start-m-t">Cold start Lambda (điện thoại)</title><desc id="flow-lambda-cold-start-m-d">Một lần gọi Lambda khi khởi động lạnh: tải ảnh chứa, Init chạy một lần cho mỗi môi trường, rồi Handler chạy cho mỗi request.</desc><defs><marker id="flow-lambda-cold-start-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-lambda-cold-start-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="340" fill="#0B0F14"/><g id="flow-lambda-cold-start-m-n1"><rect x="24" y="36" width="312" height="60" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="180" y="65" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Tải ảnh chứa</text><text x="180" y="81" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">chỉ khi cold</text></g><g id="flow-lambda-cold-start-m-n2"><rect x="24" y="116" width="312" height="72" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5"/><text x="180" y="151" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Init (import, global)</text><text x="180" y="167" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">1 lần / môi trường</text></g><g id="flow-lambda-cold-start-m-n3"><rect x="24" y="208" width="312" height="60" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="180" y="237" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Handler</text><text x="180" y="253" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">việc của request</text></g><path id="flow-lambda-cold-start-m-n4" d="M180 96 V116" fill="none" stroke="#9AA6B2" stroke-width="1.5" marker-end="url(#flow-lambda-cold-start-m-arr-m)"/><path id="flow-lambda-cold-start-m-n5" d="M180 188 V208" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-lambda-cold-start-m-arr)"/><text x="180" y="300" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Môi trường ấm: bỏ qua hai khối đầu</text><text x="180" y="324" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Init chạy 1 lần cho mỗi môi trường</text></svg>
