<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352" role="img" aria-labelledby="flow-idempotency-m-t flow-idempotency-m-d"><title id="flow-idempotency-m-t">Idempotency key (điện thoại)</title><desc id="flow-idempotency-m-d">Client gửi Idempotency-Key; server tra bảng khóa: đã có thì trả response cũ, chưa có thì thực thi rồi lưu kết quả.</desc><defs><marker id="flow-idempotency-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-idempotency-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="352" fill="#0B0F14"/><g id="flow-idempotency-m-n1"><rect x="24" y="20" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="45" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Client</text><text x="180" y="61" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">UUID v4</text></g><g id="flow-idempotency-m-n2"><rect x="24" y="92" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="117" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Tra khóa</text><text x="180" y="133" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">UNIQUE key</text></g><g id="flow-idempotency-m-n3"><rect x="24" y="164" width="150" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="99" y="189" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Đã có key</text><text x="99" y="205" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">trả response cũ</text></g><g id="flow-idempotency-m-n4"><rect x="186" y="164" width="150" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="261" y="189" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Chưa có key</text><text x="261" y="205" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">thực thi + lưu</text></g><g id="flow-idempotency-m-n5"><rect x="24" y="236" width="312" height="52" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="180" y="261" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Trả response</text><text x="180" y="277" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">201 Created</text></g><path id="flow-idempotency-m-n6" d="M180 72 V92" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-m-arr)"/><path id="flow-idempotency-m-n7" d="M180 144 V154 H99 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-m-arr)"/><path id="flow-idempotency-m-n8" d="M180 154 H261 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-m-arr)"/><path id="flow-idempotency-m-n9" d="M99 216 V226 H180 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-m-arr)"/><path id="flow-idempotency-m-n10" d="M261 216 V226 H180 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-idempotency-m-arr)"/><text x="180" y="316" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Retry không kèm key</text><text x="180" y="340" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">vẫn tạo bản ghi trùng</text></svg>
