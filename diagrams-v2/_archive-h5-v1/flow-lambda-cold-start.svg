<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-labelledby="flow-lambda-cold-start-d-t flow-lambda-cold-start-d-d"><title id="flow-lambda-cold-start-d-t">Cold start Lambda</title><desc id="flow-lambda-cold-start-d-d">Một lần gọi Lambda khi khởi động lạnh: tải ảnh chứa, Init chạy một lần cho mỗi môi trường, rồi Handler chạy cho mỗi request.</desc><defs><marker id="flow-lambda-cold-start-d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-lambda-cold-start-d-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="640" height="210" fill="#0B0F14"/><g id="flow-lambda-cold-start-d-n1"><rect x="12" y="56" width="130" height="64" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="77" y="87" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Tải ảnh chứa</text><text x="77" y="103" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">chỉ khi cold</text></g><g id="flow-lambda-cold-start-d-n2"><rect x="154" y="56" width="270" height="64" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5"/><text x="289" y="87" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Init (import, global)</text><text x="289" y="103" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">1 lần / môi trường</text></g><g id="flow-lambda-cold-start-d-n3"><rect x="436" y="56" width="192" height="64" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="532" y="87" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Handler</text><text x="532" y="103" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">việc của request</text></g><line x1="12" y1="144" x2="628" y2="144" stroke="#2A323D" stroke-width="2"/><text x="12" y="170" text-anchor="start" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">t = 0</text><text x="628" y="170" text-anchor="end" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">hết request</text><text x="320" y="198" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Môi trường ấm: bỏ qua hai khối đầu</text></svg>
