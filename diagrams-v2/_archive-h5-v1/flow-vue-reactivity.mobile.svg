<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="flow-vue-reactivity-m-t flow-vue-reactivity-m-d"><title id="flow-vue-reactivity-m-t">Vue reactivity (điện thoại)</title><desc id="flow-vue-reactivity-m-d">State reactive đi qua Proxy: đọc thì track phụ thuộc, ghi thì trigger, effect chạy lại và vá DOM.</desc><defs><marker id="flow-vue-reactivity-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-vue-reactivity-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="360" fill="#0B0F14"/><g id="flow-vue-reactivity-m-n1"><rect x="24" y="20" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="45" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">reactive()</text><text x="180" y="61" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">state.count</text></g><g id="flow-vue-reactivity-m-n2"><rect x="24" y="92" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="117" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Proxy get/set</text><text x="180" y="133" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">ref / shallowRef</text></g><g id="flow-vue-reactivity-m-n3"><rect x="24" y="164" width="150" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="99" y="189" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">track</text><text x="99" y="205" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">lúc đọc</text></g><g id="flow-vue-reactivity-m-n4"><rect x="186" y="164" width="150" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="261" y="189" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">trigger</text><text x="261" y="205" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">lúc ghi</text></g><g id="flow-vue-reactivity-m-n5"><rect x="24" y="236" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="261" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Effect chạy lại</text><text x="180" y="277" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">vá DOM</text></g><path id="flow-vue-reactivity-m-n6" d="M180 72 V92" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-vue-reactivity-m-arr)"/><path id="flow-vue-reactivity-m-n7" d="M180 144 V154 H99 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-vue-reactivity-m-arr)"/><path id="flow-vue-reactivity-m-n8" d="M180 154 H261 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-vue-reactivity-m-arr)"/><path id="flow-vue-reactivity-m-n9" d="M99 216 V226 H180 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-vue-reactivity-m-arr)"/><path id="flow-vue-reactivity-m-n10" d="M261 216 V226 H180 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-vue-reactivity-m-arr)"/><text x="180" y="322" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Batching: nhiều ghi trong một tick</text><text x="180" y="346" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">chỉ render một lần</text></svg>
