<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="flow-ddos-defense-d-t flow-ddos-defense-d-d"><title id="flow-ddos-defense-d-t">Phòng thủ DDoS theo tầng</title><desc id="flow-ddos-defense-d-d">Botnet dội lưu lượng vào biên, WAF và giới hạn tốc độ; gói rác chết ở đó, người dùng thật đi qua tới tầng tính toán và cơ sở dữ liệu đã có trần.</desc><defs><marker id="flow-ddos-defense-d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-ddos-defense-d-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="640" height="240" fill="#0B0F14"/><rect x="188" y="24" width="164" height="200" rx="8" fill="none" stroke="#2A323D" stroke-width="1.5"/><g id="flow-ddos-defense-d-n1"><rect x="12" y="28" width="120" height="56" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="72" y="55" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">BOTNET</text><text x="72" y="71" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">vô số nguồn</text></g><g id="flow-ddos-defense-d-n2"><rect x="12" y="140" width="120" height="56" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="72" y="167" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Người thật</text><text x="72" y="183" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">gửi request</text></g><g id="flow-ddos-defense-d-n3"><rect x="200" y="36" width="140" height="40" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="270" y="61" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">BIÊN</text></g><g id="flow-ddos-defense-d-n4"><rect x="200" y="92" width="140" height="40" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="270" y="111" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">WAF</text><text x="270" y="127" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">luật</text></g><g id="flow-ddos-defense-d-n5"><rect x="200" y="148" width="140" height="40" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="270" y="167" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">GIỚI HẠN</text><text x="270" y="183" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">429 / 503</text></g><g id="flow-ddos-defense-d-n6"><rect x="430" y="60" width="196" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="528" y="85" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Lambda</text><text x="528" y="101" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">trần concurrency</text></g><g id="flow-ddos-defense-d-n7"><rect x="430" y="142" width="196" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="528" y="167" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Cơ sở dữ liệu</text><text x="528" y="183" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">trần connection pool</text></g><path id="flow-ddos-defense-d-n8" d="M132 56 H200" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-ddos-defense-d-arr-m)"/><text x="166" y="48" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">gói rác</text><path id="flow-ddos-defense-d-n9" d="M132 168 H200" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-d-arr)"/><text x="166" y="190" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#FFB000">khe hở</text><path id="flow-ddos-defense-d-n10" d="M270 76 V92" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-d-arr)"/><path id="flow-ddos-defense-d-n11" d="M270 132 V148" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-d-arr)"/><path id="flow-ddos-defense-d-n12" d="M340 168 H380 V86 H430" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-d-arr)"/><path id="flow-ddos-defense-d-n13" d="M340 168 H430" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-d-arr)"/><text x="320" y="232" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Trần để chậm, không để sập</text></svg>
