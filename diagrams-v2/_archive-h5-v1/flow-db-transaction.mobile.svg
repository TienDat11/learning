<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-labelledby="flow-db-transaction-m-t flow-db-transaction-m-d"><title id="flow-db-transaction-m-t">Transaction PostgreSQL (điện thoại)</title><desc id="flow-db-transaction-m-d">BEGIN rồi các câu ghi; nếu tất cả thành công thì COMMIT, có lỗi thì ROLLBACK.</desc><defs><marker id="flow-db-transaction-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-db-transaction-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="410" fill="#0B0F14"/><g id="flow-db-transaction-m-n1"><rect x="24" y="20" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="51" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">BEGIN</text></g><path id="flow-db-transaction-m-n2" d="M180 72 V92" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-db-transaction-m-arr)"/><g id="flow-db-transaction-m-n3"><rect x="24" y="92" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="123" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">UPDATE orders</text></g><path id="flow-db-transaction-m-n4" d="M180 144 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-db-transaction-m-arr)"/><g id="flow-db-transaction-m-n5"><rect x="24" y="164" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="195" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">UPDATE stock</text></g><path id="flow-db-transaction-m-n6" d="M180 216 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-db-transaction-m-arr)"/><g id="flow-db-transaction-m-n7"><rect x="24" y="236" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="267" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">INSERT audit</text></g><g id="flow-db-transaction-m-n8"><rect x="24" y="316" width="150" height="52" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="99" y="341" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">COMMIT</text><text x="99" y="357" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">thành công</text></g><g id="flow-db-transaction-m-n9"><rect x="186" y="316" width="150" height="52" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="261" y="341" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">ROLLBACK</text><text x="261" y="357" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">có lỗi</text></g><path id="flow-db-transaction-m-n10" d="M180 288 V302 H99 V316" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-db-transaction-m-arr)"/><path id="flow-db-transaction-m-n11" d="M180 302 H261 V316" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-db-transaction-m-arr-m)"/><text x="180" y="398" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Deadlock: PostgreSQL huỷ một bên</text></svg>
