<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 404" role="img" aria-labelledby="flow-auth-jwt-m-t flow-auth-jwt-m-d"><title id="flow-auth-jwt-m-t">Xác thực JWT (điện thoại)</title><desc id="flow-auth-jwt-m-d">Token từ header Authorization được kiểm tra chữ ký, hạn dùng và scope; hợp lệ thì 200, sai hoặc hết hạn thì 401.</desc><defs><marker id="flow-auth-jwt-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-auth-jwt-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="404" fill="#0B0F14"/><g id="flow-auth-jwt-m-n1"><rect x="24" y="20" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="45" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Login</text><text x="180" y="61" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">POST /auth</text></g><g id="flow-auth-jwt-m-n2"><rect x="24" y="92" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="117" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Ký token</text><text x="180" y="133" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">RS256, exp</text></g><g id="flow-auth-jwt-m-n3"><rect x="24" y="164" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="189" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Bearer token</text><text x="180" y="205" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">Authorization</text></g><g id="flow-auth-jwt-m-n4"><rect x="24" y="236" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="261" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Verify</text><text x="180" y="277" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">ký, hạn, scope</text></g><path id="flow-auth-jwt-m-n5" d="M180 72 V92" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-auth-jwt-m-arr)"/><path id="flow-auth-jwt-m-n6" d="M180 144 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-auth-jwt-m-arr)"/><path id="flow-auth-jwt-m-n7" d="M180 216 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-auth-jwt-m-arr)"/><path id="flow-auth-jwt-m-n8" d="M180 288 V298 H99 V308" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-auth-jwt-m-arr)"/><g id="flow-auth-jwt-m-n9"><rect x="24" y="308" width="150" height="44" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="99" y="329" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">200 + dữ liệu</text><text x="99" y="345" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">hợp lệ</text></g><path id="flow-auth-jwt-m-n10" d="M180 298 H261 V308" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-auth-jwt-m-arr-m)"/><g id="flow-auth-jwt-m-n11"><rect x="186" y="308" width="150" height="44" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="261" y="329" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">401</text><text x="261" y="345" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">sai / hết hạn</text></g><text x="180" y="388" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Không lưu session ở server</text></svg>
