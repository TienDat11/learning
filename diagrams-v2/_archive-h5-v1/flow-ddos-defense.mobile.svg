<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 476" role="img" aria-labelledby="flow-ddos-defense-m-t flow-ddos-defense-m-d"><title id="flow-ddos-defense-m-t">Phòng thủ DDoS theo tầng (điện thoại)</title><desc id="flow-ddos-defense-m-d">Botnet dội lưu lượng vào biên, WAF và giới hạn tốc độ; gói rác chết ở đó, người dùng thật đi qua tới tầng tính toán và cơ sở dữ liệu đã có trần.</desc><defs><marker id="flow-ddos-defense-m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFB000"/></marker><marker id="flow-ddos-defense-m-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/></marker></defs><rect x="0" y="0" width="360" height="476" fill="#0B0F14"/><g id="flow-ddos-defense-m-n1"><rect x="24" y="20" width="150" height="52" rx="6" fill="#151B23" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4"/><text x="99" y="45" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">BOTNET</text><text x="99" y="61" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">vô số nguồn</text></g><g id="flow-ddos-defense-m-n2"><rect x="186" y="20" width="150" height="52" rx="6" fill="#151B23" stroke="#FFB000" stroke-width="1.5"/><text x="261" y="45" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Người thật</text><text x="261" y="61" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">gửi request</text></g><g id="flow-ddos-defense-m-n3"><rect x="24" y="92" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="123" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">BIÊN</text></g><g id="flow-ddos-defense-m-n4"><rect x="24" y="164" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="189" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">WAF</text><text x="180" y="205" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">luật</text></g><g id="flow-ddos-defense-m-n5"><rect x="24" y="236" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="261" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">GIỚI HẠN</text><text x="180" y="277" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">429 / 503</text></g><g id="flow-ddos-defense-m-n6"><rect x="24" y="308" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="333" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Lambda</text><text x="180" y="349" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">trần concurrency</text></g><g id="flow-ddos-defense-m-n7"><rect x="24" y="380" width="312" height="52" rx="6" fill="#151B23" stroke="#2A323D" stroke-width="1.5"/><text x="180" y="405" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EDF2">Cơ sở dữ liệu</text><text x="180" y="421" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" fill="#9AA6B2">trần connection pool</text></g><path id="flow-ddos-defense-m-n8" d="M99 72 V82 H180 V92" fill="none" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flow-ddos-defense-m-arr-m)"/><path id="flow-ddos-defense-m-n9" d="M180 144 V164" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-m-arr)"/><path id="flow-ddos-defense-m-n10" d="M180 216 V236" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-m-arr)"/><path id="flow-ddos-defense-m-n11" d="M336 46 H348 V262 H336" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-m-arr)"/><path id="flow-ddos-defense-m-n12" d="M180 288 V308" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-m-arr)"/><path id="flow-ddos-defense-m-n13" d="M24 262 H12 V406 H24" fill="none" stroke="#FFB000" stroke-width="1.5" marker-end="url(#flow-ddos-defense-m-arr)"/><text x="180" y="462" text-anchor="middle" font-family="Chivo, Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA6B2">Trần để chậm, không để sập</text></svg>
