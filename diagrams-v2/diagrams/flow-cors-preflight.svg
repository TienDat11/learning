<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168" width="640" height="168" role="img" aria-labelledby="flow-cors-preflight-d-t flow-cors-preflight-d-d"><title id="flow-cors-preflight-d-t">Luồng CORS preflight</title><desc id="flow-cors-preflight-d-d">Trình duyệt gửi OPTIONS trước, server trả header CORS, rồi request thật được gửi và server kiểm tra origin.</desc><defs><marker id="flow-cors-preflight-d-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4F46E5"/></marker><marker id="flow-cors-preflight-d-arrow-alt" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5F5F6A"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="168" fill="#FAFAFA"/><rect class="box" data-key="opt" x="24" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="88" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Trình duyệt</text><text class="lbl" x="88" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">gửi OPTIONS</text><circle cx="24" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="24" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">1</text><rect class="box" data-key="hdr" x="176" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="240" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Server</text><text class="lbl" x="240" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">thêm CORS</text><circle cx="176" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="176" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">2</text><rect class="box" data-key="req" x="328" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="392" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Trình duyệt</text><text class="lbl" x="392" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">request thật</text><circle cx="328" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="328" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">3</text><rect class="box" data-key="chk" x="480" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="lbl" x="544" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Server</text><text class="lbl" x="544" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">xét origin</text><circle cx="480" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="480" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">4</text><path class="edge" d="M152 76 L 176 76" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-cors-preflight-d-arrow)"/><path class="edge" d="M304 76 L 328 76" fill="none" stroke="#4F46