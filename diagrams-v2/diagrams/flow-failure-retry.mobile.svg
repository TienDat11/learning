<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 512" width="360" height="512" role="img" aria-labelledby="flow-failure-retry-m-t flow-failure-retry-m-d"><title id="flow-failure-retry-m-t">Retry với backoff (điện thoại)</title><desc id="flow-failure-retry-m-d">Gọi dịch vụ, lỗi tạm thời thì chờ lâu dần rồi thử lại; hết số lần cho phép thì đưa sang DLQ và cảnh báo.</desc><defs><marker id="flow-failure-retry-m-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4F46E5"/></marker><marker id="flow-failure-retry-m-arrow-alt" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5F5F6A"/></marker></defs><rect class="bg" x="0" y="0" width="360" height="512" fill="#FAFAFA"/><rect class="box" data-key="call" x="64" y="48" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Gọi dịch vụ</text><text class="lbl" x="196" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">lần thử</text><circle cx="64" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="64" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">1</text><rect class="box" data-key="err" x="64" y="144" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Lỗi tạm thời</text><text class="lbl" x="196" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">5xx, timeout</text><circle cx="64" cy="144" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="64" y="149" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">2</text><rect class="box" data-key="wait" x="64" y="240" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="265" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Chờ backoff</text><text class="lbl" x="196" y="281" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">1s, 2s, 4s</text><circle cx="64" cy="240" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="64" y="245" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">3</text><rect class="box" data-key="check" x="64" y="336" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="361" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Còn lượt?</text><text class="lbl" x="196" y="377" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">tối đa 5 lần</text><circle cx="64" cy="336" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="64" y="341" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">4</text><rect class="box" data-key="dlq" x="64" y="432" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="196" y="457" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">DLQ + cảnh báo</text><text class="lbl" x="196" y="473" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5F6A">cần người xem</text><path class="edge" d="M196 104 L 196 144" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-failure-retry-m-arrow)"/><path class="edge" d="M196 200 L 196 240" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-failure-retry-m-arrow)"/><path class="edge" d="M196 296 L 196 336" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-failure-retry-m-arrow)"/><path class="edge" d="M196 392 L 196 432" fill="none" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flow-failure-retry-m-arrow-alt)"/><path class="edge" d="M328 364 L 344 364 L 344 76 L 328 76" fill="none" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flow-failure-retry-m-arrow-alt)"/></svg>
