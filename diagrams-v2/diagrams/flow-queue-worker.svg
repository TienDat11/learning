<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="flow-queue-worker-d-t flow-queue-worker-d-d"><title id="flow-queue-worker-d-t">Hàng đợi SQS và worker</title><desc id="flow-queue-worker-d-d">Producer đẩy message vào SQS, worker poll và xử lý, xoá message khi xong; quá số lần lỗi thì chuyển sang DLQ.</desc><defs><marker id="flow-queue-worker-d-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4F46E5"/></marker><marker id="flow-queue-worker-d-arrow-alt" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5F5F6A"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="200" fill="#FAFAFA"/><rect class="box" data-key="prod" x="24" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="88" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Producer</text><text class="lbl" x="88" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">đẩy message</text><circle cx="24" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="24" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">1</text><rect class="box" data-key="sqs" x="176" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="240" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">SQS</text><text class="lbl" x="240" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">hàng đợi</text><circle cx="176" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="176" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">2</text><rect class="box" data-key="wk" x="328" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="392" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Worker</text><text class="lbl" x="392" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">poll, xử lý</text><circle cx="328" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="328" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">3</text><rect class="box" data-key="del" x="480" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="lbl" x="544" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Xoá message</text><text class="lbl" x="544" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">sau khi xong</text><circle cx="480" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="480" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">4</text><rect class="box" data-key="dlq" x="176" y="144" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="240" y="169" text-anchor="middle" font-