<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 208" width="640" height="208" role="img" aria-labelledby="flow-ddos-defense-d-t flow-ddos-defense-d-d"><title id="flow-ddos-defense-d-t">Phòng thủ DDoS theo tầng</title><desc id="flow-ddos-defense-d-d">Botnet bị hấp thụ ở biên; người dùng thật qua WAF và giới hạn tốc độ, tới Lambda và Database đã có trần.</desc><defs><marker id="flow-ddos-defense-d-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4F46E5"/></marker><marker id="flow-ddos-defense-d-arrow-alt" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5F5F6A"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="208" fill="#FAFAFA"/><rect class="box" data-key="bot" x="24" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="88" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Botnet</text><text class="lbl" x="88" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5F6A">vô số nguồn</text><rect class="box" data-key="bien" x="176" y="48" width="152" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="252" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Biên</text><text class="lbl" x="252" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">hấp thụ tải lớn</text><rect class="box" data-key="user" x="24" y="144" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="88" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Người thật</text><text class="lbl" x="88" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">gửi request</text><circle cx="24" cy="144" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="24" y="149" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">1</text><rect class="box" data-key="waf" x="176" y="144" width="136" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="244" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">WAF</text><text class="lbl" x="244" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">luật, giới hạn</text><circle cx="176" cy="144" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="176" y="149" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">2</text><rect class="box" data-key="lam" x="336" y="144" width="144" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="408" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Lambda</text><text class="lbl" x="408" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">trần đồng thời</text><circle cx="336" cy="144" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="336" y="149" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">3</text><rect class="box" data-key="db" x="504" y="144" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="lbl" x="568" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Database</text><text class="lbl" x="568" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">trần kết nối</text><circle cx="504" cy="144" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="504" y="149" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">4</text><path class="edge" d="M152 76 L 176 76" fill="none" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flow-ddos-defense-d-arrow-alt)"/><path class="edge" d="M152 172 L 176 172" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-ddos-defense-d-arrow)"/><path class="edge" d="M244 104 L 244 144" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-ddos-defense-d-arrow)"/><path class="edge" d="M312 172 L 336 172" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-ddos-defense-d-arrow)"/><path class="edge" d="M480 172 L 504 172" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-ddos-defense-d-arrow)"/></svg>
