<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 608" width="360" height="608" role="img" aria-labelledby="flow-auth-jwt-m-t flow-auth-jwt-m-d"><title id="flow-auth-jwt-m-t">Xác thực JWT (điện thoại)</title><desc id="flow-auth-jwt-m-d">Đăng nhập, server ký token, client gửi kèm Bearer token, server kiểm tra chữ ký, hạn và scope rồi trả 200 hoặc 401.</desc><defs><marker id="flow-auth-jwt-m-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4F46E5"/></marker><marker id="flow-auth-jwt-m-arrow-alt" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5F5F6A"/></marker></defs><rect class="bg" x="0" y="0" width="360" height="608" fill="#FAFAFA"/><rect class="box" data-key="login" x="64" y="48" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Login</text><text class="lbl" x="196" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">POST /auth</text><circle cx="64" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="64" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">1</text><rect class="box" data-key="sign" x="64" y="144" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Ký token</text><text class="lbl" x="196" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">RS256, exp</text><circle cx="64" cy="144" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="64" y="149" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">2</text><rect class="box" data-key="bearer" x="64" y="240" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="265" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Bearer token</text><text class="lbl" x="196" y="281" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">Authorization</text><circle cx="64" cy="240" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="64" y="245" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">3</text><rect class="box" data-key="verify" x="64" y="336" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="196" y="361" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Verify</text><text class="lbl" x="196" y="377" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">chữ ký, hạn</text><circle cx="64" cy="336" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="64" y="341" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">4</text><rect class="box" data-key="ok" x="64" y="432" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="lbl" x="196" y="457" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">200 OK</text><text class="lbl" x="196" y="473" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">trả dữ liệu</text><circle cx="64" cy="432" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="64" y="437" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">5</text><rect class="box" data-key="deny" x="64" y="528" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="196" y="553" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">401</text><text class="lbl" x="196" y="569" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5F6A">sai, hết hạn</text><path class="edge" d="M196 104 L 196 144" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-auth-jwt-m-arrow)"/><path class="edge" d="M196 200 L 196 240" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-auth-jwt-m-arrow)"/><path class="edge" d="M196 296 L 196 336" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-auth-jwt-m-arrow)"/><path class="edge" d="M196 392 L 196 432" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-auth-jwt-m-arrow)"/><path class="edge" d="M328 364 L 344 364 L 344 556 L 328 556" fill="none" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flow-auth-jwt-m-arrow-alt)"/></svg>
