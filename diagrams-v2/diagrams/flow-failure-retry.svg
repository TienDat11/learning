<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 208" width="640" height="208" role="img" aria-labelledby="flow-failure-retry-d-t flow-failure-retry-d-d"><title id="flow-failure-retry-d-t">Retry với backoff</title><desc id="flow-failure-retry-d-d">Gọi dịch vụ, lỗi tạm thời thì chờ lâu dần rồi thử lại; hết số lần cho phép thì đưa sang DLQ và cảnh báo.</desc><defs><marker id="flow-failure-retry-d-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4F46E5"/></marker><marker id="flow-failure-retry-d-arrow-alt" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5F5F6A"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="208" fill="#FAFAFA"/><rect class="box" data-key="call" x="24" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="88" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Gọi dịch vụ</text><text class="lbl" x="88" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">lần thử</text><circle cx="24" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="24" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">1</text><rect class="box" data-key="err" x="176" y="48" width="136" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="244" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Lỗi tạm thời</text><text class="lbl" x="244" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">5xx, timeout</text><circle cx="176" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="176" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">2</text><rect class="box" data-key="wait" x="336" y="48" width="136" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="404" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Chờ backoff</text><text class="lbl" x="404" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">1s, 2s, 4s</text><circle cx="336" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="336" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">3</text><rect class="box" data-key="check" x="496" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="560" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Còn lượt?</text><text class="lbl" x="560" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">tối đa 5 lần</text><circle cx="496" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="496" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">4</text><rect class="box" data-key="dlq" x="472" y="144" width="152" height="56" rx="8" fill="#FFFFFF" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="548" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">DLQ + cảnh báo</text><text class="lbl" x="548" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5F6A">cần người xem</text><path class="edge" d="M152 76 L 176 76" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-failure-retry-d-arrow)"/><path class="edge" d="M312 76 L 336 76" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-failure-retry-d-arrow)"/><path class="edge" d="M472 76 L 496 76" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-failure-retry-d-arrow)"/><path class="edge" d="M560 104 L 560 144" fill="none" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flow-failure-retry-d-arrow-alt)"/><path class="edge" d="M520 104 L 520 128 L 88 128 L 88 104" fill="none" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flow-failure-retry-d-arrow-alt)"/><text class="ext" x="200" y="148" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5F6A">thử lại</text><text class="ext" x="568" y="124" text-anchor="start" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5F6A">hết lượt</text></svg>
