<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216" width="640" height="216" role="img" aria-labelledby="flow-auth-jwt-d-t flow-auth-jwt-d-d"><title id="flow-auth-jwt-d-t">Xác thực JWT</title><desc id="flow-auth-jwt-d-d">Đăng nhập, server ký token, client gửi kèm Bearer token, server kiểm tra chữ ký, hạn và scope rồi trả 200 hoặc 401.</desc><defs><marker id="flow-auth-jwt-d-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4F46E5"/></marker><marker id="flow-auth-jwt-d-arrow-alt" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5F5F6A"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="216" fill="#FAFAFA"/><rect class="box" data-key="login" x="24" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="88" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Login</text><text class="lbl" x="88" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">POST /auth</text><circle cx="24" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="24" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">1</text><rect class="box" data-key="sign" x="176" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="240" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Ký token</text><text class="lbl" x="240" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">RS256, exp</text><circle cx="176" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="176" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">2</text><rect class="box" data-key="bearer" x="328" y="48" width="136" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="396" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Bearer token</text><text class="lbl" x="396" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">Authorization</text><circle cx="328" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="328" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">3</text><rect class="box" data-key="verify" x="488" y="48" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#C9C9D1" stroke-width="1.5"/><text class="lbl" x="552" y="73" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Verify</text><text class="lbl" x="552" y="89" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">chữ ký, hạn</text><circle cx="488" cy="48" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="488" y="53" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">4</text><rect class="box" data-key="ok" x="488" y="144" width="128" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="lbl" x="552" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">200 OK</text><text class="lbl" x="552" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#4A4A54">trả dữ liệu</text><circle cx="488" cy="144" r="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text class="num" x="488" y="149" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">5</text><rect class="box" data-key="deny" x="328" y="144" width="136" height="56" rx="8" fill="#FFFFFF" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="396" y="169" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">401</text><text class="lbl" x="396" y="185" text-anchor="middle" font-family="Be Vietnam Pro, system-ui, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5F6A">sai, hết hạn</text><path class="edge" d="M152 76 L 176 76" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-auth-jwt-d-arrow)"/><path class="edge" d="M304 76 L 328 76" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-auth-jwt-d-arrow)"/><path class="edge" d="M464 76 L 488 76" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-auth-jwt-d-arrow)"/><path class="edge" d="M552 104 L 552 144" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#flow-auth-jwt-d-arrow)"/><path class="edge" d="M500 104 L 500 124 L 396 124 L 396 144" fill="none" stroke="#5F5F6A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flow-auth-jwt-d-arrow-alt)"/></svg>
